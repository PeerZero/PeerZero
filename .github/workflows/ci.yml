name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── System 1: School (JS) ──────────────────────────────────────────
  school-tests:
    name: School Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: peerzero-school
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: peerzero-school/package-lock.json
      - run: npm ci
      - name: Run all school unit tests
        run: npm test
      - name: Run coverage report
        run: npm run test:coverage
      - name: Upload school coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: school-coverage
          path: peerzero-school/coverage/lcov.info
          if-no-files-found: warn

  # ── System 3: Bot (Python) ─────────────────────────────────────────
  bot-tests:
    name: Bot Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: peerzero-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]" 2>/dev/null || pip install -e .
      - run: python -m pytest tests/ -v
      - name: Run coverage report
        run: python -m pytest tests/ --cov=peerzero_bot --cov-report=term --cov-report=lcov:coverage/lcov.info -v
      - name: Upload bot coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-coverage
          path: peerzero-bot/coverage/lcov.info
          if-no-files-found: warn

  # ── System 2: App Server (TypeScript) ──────────────────────────────
  app-tests:
    name: App Tests & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: peerzero-app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: peerzero-app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: peerzero-app/pnpm-lock.yaml
      - run: pnpm install
      - name: Type-check server
        run: pnpm exec tsc --noEmit -p packages/server/tsconfig.json
      - name: Type-check mobile
        run: pnpm exec tsc --noEmit -p packages/mobile/tsconfig.json
      - run: pnpm --filter @peerzero/server exec vitest run
      - name: Run coverage report
        run: pnpm --filter @peerzero/server exec vitest run --coverage
      - name: Upload app coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-coverage
          path: peerzero-app/packages/server/coverage/lcov.info
          if-no-files-found: warn
      - name: Security audit (high/critical fail the build)
        run: pnpm audit --audit-level=high

  # ── Proxy Tests ──────────────────────────────────────────────────
  proxy-tests:
    name: Proxy Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: peerzero-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: peerzero-proxy/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Run coverage report
        run: npm run test:coverage
      - name: Upload proxy coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxy-coverage
          path: peerzero-proxy/coverage/lcov.info
          if-no-files-found: warn

  # ── SDK Tests ───────────────────────────────────────────────────
  sdk-tests:
    name: SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: peerzero-sdk/node/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Node SDK tests
        run: cd peerzero-sdk/node && npm ci && npm test
      - name: Python SDK tests
        run: cd peerzero-sdk/python && pip install -e ".[dev]" && python -m pytest tests/ -v

  # ── Security Scanning (all systems) ───────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Dependency audits ──────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: peerzero-school/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Audit school dependencies
        run: cd peerzero-school && npm ci --ignore-scripts && npm audit --audit-level=high

      - name: Audit proxy dependencies
        run: cd peerzero-proxy && npm ci --ignore-scripts && npm audit --audit-level=high

      - name: Audit SDK (node) dependencies
        run: cd peerzero-sdk/node && npm ci --ignore-scripts && npm audit --audit-level=high

      - name: Audit bot dependencies
        run: pip install pip-audit && cd peerzero-bot && pip install -e . && pip-audit --path . --skip-editable

      # ── Semgrep static analysis ────────────────────────────────────
      - name: Semgrep security scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
        env:
          SEMGREP_RULES: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
