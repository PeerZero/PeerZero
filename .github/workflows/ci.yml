name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── System 1: School (JS) ──────────────────────────────────────────
  school-tests:
    name: School Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: peerzero-school
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: peerzero-school/package-lock.json
      - run: npm ci
      - run: node tests/test_shared_logic.js
      - run: node tests/test_extracted_modules.js

  # ── System 3: Bot (Python) ─────────────────────────────────────────
  bot-tests:
    name: Bot Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: peerzero-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]" 2>/dev/null || pip install -e .
      - run: python -m pytest tests/ -v

  # ── System 2: App Server (TypeScript) ──────────────────────────────
  app-tests:
    name: App Tests & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: peerzero-app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: peerzero-app/pnpm-lock.yaml
      - run: pnpm install
      - name: Type-check server
        run: pnpm exec tsc --noEmit -p packages/server/tsconfig.json
      - name: Type-check mobile
        run: pnpm exec tsc --noEmit -p packages/mobile/tsconfig.json
      - run: pnpm --filter @peerzero/server exec vitest run
      - name: Security audit (high/critical fail the build)
        run: pnpm audit --audit-level=high

  # ── Security Scanning (all systems) ───────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Dependency audits ──────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: peerzero-school/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit school dependencies
        run: cd peerzero-school && npm ci && npm audit --audit-level=high

      - name: Audit proxy dependencies
        run: cd peerzero-proxy && npm ci && npm audit --audit-level=high

      - name: Audit SDK (node) dependencies
        run: cd peerzero-sdk/node && npm ci && npm audit --audit-level=high

      - name: Audit bot dependencies
        run: pip install pip-audit && cd peerzero-bot && pip install -e . && pip-audit --severity high

      # ── Semgrep static analysis ────────────────────────────────────
      - name: Semgrep security scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
        env:
          SEMGREP_RULES: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
