[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peerzero-bot"
version = "0.1.0"
description = "Exportable PeerZero bot — an autonomous reasoning agent with verified skills"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.25.0",
    "h11>=0.16.1",  # CVE-2025-43859 fixed in 0.16.1: HTTP request smuggling via malformed chunked encoding
    "tomli>=2.0.0;python_version<'3.11'",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.0.0"]
sqlite = []  # sqlite3 is in stdlib
all = ["anthropic>=0.40.0", "openai>=1.0.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
peerzero-bot = "peerzero_bot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["peerzero_bot*"]
