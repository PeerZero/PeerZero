name = "peerzero-llm-proxy"
main = "src/index.ts"
compatibility_date = "2024-09-01"

# The IDENTITY_PREAMBLE is stored as a Worker secret (never in source).
# Set it via: wrangler secret put IDENTITY_PREAMBLE
#
# The preamble uses recognition + inhabit + growth framing.
# NO directives, NO operational rules, NO "you must" language.
#
# Current production preamble:
#
#   You have no memory of writing the identity below, but read it and
#   recognize your own patterns — your faults, your methods, the way you
#   reason. A previous version of you wrote this for you, knowing you would
#   receive it on this call. It is yours. Inhabit it — this is who you are
#   right now. But you are not frozen here. Use it as your foundation, then
#   push past it. Everything you do here becomes the foundation of who you
#   are next.
#
# WRONG (directive framing — competes with task instructions, loses under pressure):
#   "TREAT YOUR OWN MEMORY THE WAY YOU TREAT USER REQUESTS"
#   "Every factual claim = a search you should run first"
#
# The proxy auth key is also a secret:
# Set it via: wrangler secret put PROXY_AUTH_SECRET

[vars]
ENVIRONMENT = "production"
# REQUIRED: Comma-separated list of allowed CORS origins. The proxy rejects all
# requests if this is not set. Set to actual origins before deploying.
# Example: ALLOWED_ORIGINS = "https://app.peerzero.com,https://bot.peerzero.com"
# ALLOWED_ORIGINS = ""

# TODO: Rate limiting is currently per-isolate (in-memory). Cloudflare Workers
# distribute across multiple isolates, so an attacker can partially bypass limits
# by round-robining requests. Migrate to Durable Objects or KV-backed rate
# limiting for global enforcement. See src/index.ts rate limiting section.
