<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PeerZero Bot Avatar Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f0a1a;
    color: #e0d8f0;
    min-height: 100vh;
    padding: 24px;
  }
  h1 { text-align: center; font-size: 28px; margin-bottom: 4px; color: #fff; }
  .subtitle { text-align: center; color: #8b7faa; font-size: 14px; margin-bottom: 32px; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
    margin-bottom: 32px; max-width: 900px; margin-left: auto; margin-right: auto;
  }
  .control-group { display: flex; flex-direction: column; gap: 4px; }
  .control-group label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #8b7faa; }
  select, input[type=text] {
    background: #1a1428; border: 1px solid #2d2440; border-radius: 8px;
    color: #e0d8f0; padding: 8px 12px; font-size: 14px; min-width: 140px;
  }
  .color-swatches { display: flex; gap: 4px; flex-wrap: wrap; }
  .swatch {
    width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; transition: border-color 0.15s;
  }
  .swatch.active, .swatch:hover { border-color: #fff; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px; max-width: 1100px; margin: 0 auto;
  }
  .card {
    background: #1a1428; border-radius: 16px; padding: 16px;
    text-align: center; border: 1px solid #2d2440;
  }
  .card svg { display: block; margin: 0 auto 8px; }
  .card-label { font-size: 12px; color: #8b7faa; }
  .card-title { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .section-title {
    text-align: center; font-size: 18px; font-weight: 600;
    margin: 36px 0 16px; color: #c4b5e0;
  }
  .single-preview {
    display: flex; justify-content: center; margin-bottom: 32px;
  }
  .single-card {
    background: #1a1428; border-radius: 20px; padding: 24px;
    text-align: center; border: 1px solid #2d2440; min-width: 200px;
  }
  .single-card svg { display: block; margin: 0 auto 12px; }
  .single-card .card-title { font-size: 18px; }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.03); }
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }
  .animate-breathe { animation: breathe 3.6s ease-in-out infinite; }
  .animate-bounce { animation: bounce 2.4s ease-in-out infinite; }
  .animate-both { animation: breathe 3.6s ease-in-out infinite, bounce 2.4s ease-in-out infinite; }
</style>
</head>
<body>

<h1>PeerZero Bot Avatar Preview</h1>
<p class="subtitle">Procedurally generated Tamagotchi-style creatures that evolve with your bot</p>

<div class="controls">
  <div class="control-group">
    <label>Bot ID (seed)</label>
    <input type="text" id="botId" value="bot_abc123_demo" oninput="render()">
  </div>
  <div class="control-group">
    <label>Body Color</label>
    <div class="color-swatches" id="swatches"></div>
  </div>
  <div class="control-group">
    <label>Status</label>
    <select id="status" onchange="render()">
      <option value="running">Running (Happy)</option>
      <option value="stopped">Stopped (Sleeping)</option>
      <option value="paused">Paused (Curious)</option>
      <option value="error">Error (Distressed)</option>
    </select>
  </div>
  <div class="control-group">
    <label>Mood</label>
    <select id="mood" onchange="render()">
      <option value="neutral">Neutral</option>
      <option value="positive">Positive</option>
      <option value="negative">Negative</option>
      <option value="milestone">Milestone</option>
      <option value="proud">Proud</option>
      <option value="focused">Focused</option>
      <option value="excited">Excited</option>
      <option value="shy">Shy</option>
      <option value="tired">Tired</option>
    </select>
  </div>
  <div class="control-group">
    <label>Accessory</label>
    <select id="accessory" onchange="render()">
      <option value="">None</option>
      <option value="tiny_glasses">Tiny Glasses</option>
      <option value="lab_coat">Lab Coat</option>
      <option value="bow_tie">Bow Tie</option>
      <option value="beret">Beret</option>
      <option value="stethoscope">Stethoscope</option>
      <option value="graduation_cap">Graduation Cap</option>
    </select>
  </div>
  <div class="control-group">
    <label>Hunger</label>
    <select id="hunger" onchange="render()">
      <option value="satisfied">Satisfied</option>
      <option value="curious">Curious (3+ days)</option>
      <option value="yearning">Yearning (1+ week)</option>
      <option value="starving">Starving (2+ weeks)</option>
    </select>
  </div>
</div>

<div class="single-preview" id="mainPreview"></div>
<div class="section-title">Evolution Stages (Tier 0 &rarr; 5)</div>
<div class="grid" id="tierGrid"></div>
<div class="section-title">All Statuses</div>
<div class="grid" id="statusGrid"></div>
<div class="section-title">All Moods (Running)</div>
<div class="grid" id="moodGrid"></div>
<div class="section-title">All Accessories (at Tier 3)</div>
<div class="grid" id="accessoryGrid"></div>
<div class="section-title">All 30 Species (at Tier 3)</div>
<div class="grid" id="speciesGrid"></div>
<div class="section-title">Random Bots Gallery</div>
<div class="grid" id="galleryGrid"></div>

<script>
// ── Port of BotAvatar.tsx SVG logic to plain JS ──

const COLORS = [
  '#6C5CE7', '#FF6B6B', '#4ECDC4', '#FFE66D', '#A8E6CF',
  '#FF8A5C', '#B8B5FF', '#85E3FF', '#F8A5C2', '#78E08F',
  '#FF9FF3', '#C4B5FD', '#67E8F9', '#FCA5A5', '#86EFAC', '#FDE68A'
];
const COLOR_NAMES = [
  'Purple', 'Coral', 'Teal', 'Sunshine', 'Mint',
  'Peach', 'Lavender', 'Sky', 'Rose', 'Leaf',
  'Bubblegum', 'Wisteria', 'Ice', 'Blush', 'Clover', 'Honey'
];

let selectedColor = COLORS[0];

function hashCode(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

function seededRandom(seed, index) {
  const x = Math.sin(seed + index * 9301 + 49297) * 49381;
  return x - Math.floor(x);
}

function hexToRgb(hex) {
  const c = hex.replace('#', '');
  return { r: parseInt(c.substring(0,2),16)||100, g: parseInt(c.substring(2,4),16)||100, b: parseInt(c.substring(4,6),16)||200 };
}
function rgbToHex(r,g,b) {
  const cl = v => Math.max(0,Math.min(255,Math.round(v)));
  return '#'+[r,g,b].map(v=>cl(v).toString(16).padStart(2,'0')).join('');
}
function lighten(hex, amt) { const {r,g,b}=hexToRgb(hex); return rgbToHex(r+(255-r)*amt,g+(255-g)*amt,b+(255-b)*amt); }
function darken(hex, amt) { const {r,g,b}=hexToRgb(hex); return rgbToHex(r*(1-amt),g*(1-amt),b*(1-amt)); }

function generateTraits(botId) {
  const seed = hashCode(botId);
  const r = i => seededRandom(seed, i);
  const bodyShapes = ['round','oval','bean','pear','squish','tall','chonk','teardrop','blob','loaf','nuggie'];
  const earStyles = ['round','pointed','floppy','cat','bunny','bear','antennae','horns','tiny','huge','one'];
  const tailStyles = ['curly','fluffy','thin','stub','pom','spike','spring','fan'];
  const patternStyles = ['spots','stripes','belly','none','freckles','heart','mustache','bandaid'];
  return {
    bodyShape: bodyShapes[Math.floor(r(0)*bodyShapes.length)],
    earStyle: earStyles[Math.floor(r(1)*earStyles.length)],
    tailStyle: tailStyles[Math.floor(r(2)*tailStyles.length)],
    patternStyle: patternStyles[Math.floor(r(3)*patternStyles.length)],
    eyeSpacing: 0.3+r(4)*0.2,
    eyeSize: 0.8+r(5)*0.4,
    cheekSize: 0.5+r(6)*0.5,
  };
}

function renderAvatar(botId, color, tier, status, mood, hunger, size, accessory) {
  const traits = generateTraits(botId);
  const t = Math.max(0,Math.min(5,tier));
  const sb = t * 1.2;
  let svg = '';

  // Helper to build the SVG string
  const cx = 50, cy = 50;

  // Aura (tier 4+)
  if (t >= 4) {
    const ac = lighten(color, 0.4);
    svg += `<circle cx="50" cy="50" r="46" fill="${ac}" opacity="${t>=5?0.2:0.12}"/>`;
  }

  // Wings (tier 5)
  if (t >= 5) {
    const wc = lighten(color, 0.35);
    svg += `<g opacity="0.5">
      <path d="M 26 44 Q 8 32 14 20 Q 22 28 26 38" fill="${wc}"/>
      <path d="M 26 44 Q 4 44 8 30 Q 18 36 26 42" fill="${wc}" opacity="0.7"/>
      <path d="M 74 44 Q 92 32 86 20 Q 78 28 74 38" fill="${wc}"/>
      <path d="M 74 44 Q 96 44 92 30 Q 82 36 74 42" fill="${wc}" opacity="0.7"/>
    </g>`;
  }

  // Tail (tier 3+)
  if (t >= 3) {
    const tc = darken(color, 0.15);
    switch(traits.tailStyle) {
      case 'curly': svg += `<path d="M 22 58 Q 10 55 12 45 Q 14 38 18 42" stroke="${tc}" stroke-width="3" fill="none" stroke-linecap="round"/>`; break;
      case 'fluffy': svg += `<circle cx="16" cy="52" r="6" fill="${tc}"/><circle cx="13" cy="48" r="4.5" fill="${tc}"/><circle cx="12" cy="44" r="3.5" fill="${tc}"/>`; break;
      case 'thin': svg += `<path d="M 22 58 Q 8 52 10 42" stroke="${tc}" stroke-width="2" fill="none" stroke-linecap="round"/>`; break;
      case 'stub': svg += `<ellipse cx="20" cy="56" rx="5" ry="3.5" fill="${tc}"/>`; break;
      case 'pom': svg += `<circle cx="18" cy="54" r="5" fill="${tc}"/><circle cx="16" cy="52" r="3.5" fill="${lighten(tc,0.15)}" opacity="0.7"/><circle cx="20" cy="52" r="3" fill="${lighten(tc,0.15)}" opacity="0.5"/><circle cx="17" cy="56" r="3" fill="${lighten(tc,0.1)}" opacity="0.6"/>`; break;
      case 'spike': svg += `<path d="M 22 58 L 14 48 L 20 52 L 12 42 L 22 50" fill="${tc}"/>`; break;
      case 'spring': svg += `<path d="M 22 58 Q 14 56 18 52 Q 22 48 14 46 Q 8 44 12 40 Q 16 36 10 34" stroke="${tc}" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="10" cy="33" r="2.5" fill="${tc}"/>`; break;
      case 'fan': default: svg += `<g opacity="0.8"><path d="M 22 56 Q 6 48 4 36" stroke="${tc}" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M 22 54 Q 8 42 10 30" stroke="${tc}" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M 22 52 Q 12 38 16 28" stroke="${tc}" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="4" cy="35" r="3" fill="${lighten(tc,0.2)}"/><circle cx="10" cy="29" r="3" fill="${lighten(tc,0.15)}"/><circle cx="16" cy="27" r="3" fill="${lighten(tc,0.1)}"/></g>`; break;
    }
  }

  // Ears (tier 1+)
  if (t >= 1) {
    const ec = darken(color, 0.1), ic = lighten(color, 0.4);
    const es = t>=3?1.2:t>=2?1.0:0.7;
    switch(traits.earStyle) {
      case 'round':
        svg += `<circle cx="32" cy="24" r="${10*es}" fill="${ec}"/><circle cx="32" cy="24" r="${6*es}" fill="${ic}" opacity="0.6"/>`;
        svg += `<circle cx="68" cy="24" r="${10*es}" fill="${ec}"/><circle cx="68" cy="24" r="${6*es}" fill="${ic}" opacity="0.6"/>`;
        break;
      case 'pointed':
        svg += `<path d="M 28 ${32-2*es} L ${26-4*es} ${14-6*es} L ${38+2*es} ${28-2*es} Z" fill="${ec}"/>`;
        svg += `<path d="M 30 ${30-2*es} L ${28-2*es} ${18-4*es} L ${36+es} ${28-es} Z" fill="${ic}" opacity="0.5"/>`;
        svg += `<path d="M 72 ${32-2*es} L ${74+4*es} ${14-6*es} L ${62-2*es} ${28-2*es} Z" fill="${ec}"/>`;
        svg += `<path d="M 70 ${30-2*es} L ${72+2*es} ${18-4*es} L ${64-es} ${28-es} Z" fill="${ic}" opacity="0.5"/>`;
        break;
      case 'floppy': {
        const dropY = 30+8*es, earW = 8*es;
        svg += `<path d="M 34 26 Q ${26-earW} 24, ${22-earW} ${dropY} Q ${20-earW} ${dropY+6}, ${24-earW+4} ${dropY+2} Q 30 ${dropY-4}, 36 30" fill="${ec}"/>`;
        svg += `<path d="M 66 26 Q ${74+earW} 24, ${78+earW} ${dropY} Q ${80+earW} ${dropY+6}, ${76+earW-4} ${dropY+2} Q 70 ${dropY-4}, 64 30" fill="${ec}"/>`;
        break;
      }
      case 'cat':
        svg += `<path d="M 30 30 L ${24-4*es} ${12-6*es} L 40 ${26-2*es} Z" fill="${ec}"/>`;
        svg += `<path d="M 32 28 L ${27-2*es} ${16-4*es} L 38 ${26-es} Z" fill="${ic}" opacity="0.5"/>`;
        svg += `<path d="M 70 30 L ${76+4*es} ${12-6*es} L 60 ${26-2*es} Z" fill="${ec}"/>`;
        svg += `<path d="M 68 28 L ${73+2*es} ${16-4*es} L 62 ${26-es} Z" fill="${ic}" opacity="0.5"/>`;
        break;
      case 'bunny': {
        const earH=18*es, earW2=6*es;
        svg += `<path d="M 36 26 Q ${36-earW2} ${26-earH*0.5} ${34-earW2*0.5} ${26-earH} Q 34 ${26-earH*0.9} ${36+earW2*0.5} ${26-earH*0.3} Q 38 ${26-earH*0.1} 38 28" fill="${ec}"/>`;
        svg += `<path d="M 64 26 Q ${64+earW2} ${26-earH*0.4} ${66+earW2*0.5} ${26-earH*0.8} Q ${68+earW2*0.3} ${26-earH*0.3} 66 24 Q 64 25 62 28" fill="${ec}"/>`;
        break;
      }
      case 'bear':
        svg += `<circle cx="34" cy="22" r="${7*es}" fill="${ec}"/><circle cx="34" cy="22" r="${7*es*0.55}" fill="${ic}" opacity="0.5"/>`;
        svg += `<circle cx="66" cy="22" r="${7*es}" fill="${ec}"/><circle cx="66" cy="22" r="${7*es*0.55}" fill="${ic}" opacity="0.5"/>`;
        break;
      case 'antennae': {
        const antH=14*es, bobR=3*es;
        svg += `<path d="M 42 28 Q 38 ${28-antH*0.5} ${36-bobR} ${28-antH}" stroke="${ec}" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;
        svg += `<circle cx="${36-bobR}" cy="${28-antH}" r="${bobR}" fill="${ec}"/><circle cx="${36-bobR}" cy="${28-antH}" r="${bobR*0.5}" fill="${ic}" opacity="0.6"/>`;
        svg += `<path d="M 58 28 Q 62 ${28-antH*0.5} ${64+bobR} ${28-antH}" stroke="${ec}" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;
        svg += `<circle cx="${64+bobR}" cy="${28-antH}" r="${bobR}" fill="${ec}"/><circle cx="${64+bobR}" cy="${28-antH}" r="${bobR*0.5}" fill="${ic}" opacity="0.6"/>`;
        break;
      }
      case 'horns': {
        const hornH=10*es;
        svg += `<path d="M 36 26 Q 30 ${26-hornH*0.4} ${28-hornH*0.2} ${26-hornH}" stroke="${ec}" stroke-width="${3.5*es}" fill="none" stroke-linecap="round"/>`;
        svg += `<path d="M 64 26 Q 70 ${26-hornH*0.4} ${72+hornH*0.2} ${26-hornH}" stroke="${ec}" stroke-width="${3.5*es}" fill="none" stroke-linecap="round"/>`;
        svg += `<circle cx="${28-hornH*0.2}" cy="${26-hornH}" r="${1.5*es}" fill="${ic}" opacity="0.6"/>`;
        svg += `<circle cx="${72+hornH*0.2}" cy="${26-hornH}" r="${1.5*es}" fill="${ic}" opacity="0.6"/>`;
        break;
      }
      case 'tiny':
        svg += `<circle cx="36" cy="24" r="${3*es}" fill="${ec}"/><circle cx="36" cy="24" r="${1.5*es}" fill="${ic}" opacity="0.5"/>`;
        svg += `<circle cx="64" cy="24" r="${3*es}" fill="${ec}"/><circle cx="64" cy="24" r="${1.5*es}" fill="${ic}" opacity="0.5"/>`;
        break;
      case 'huge': {
        const hugeDrop=46+10*es, hugeW=14*es;
        svg += `<path d="M 34 24 Q ${20-hugeW} 20, ${14-hugeW} ${hugeDrop} Q ${12-hugeW} ${hugeDrop+8}, ${18-hugeW+6} ${hugeDrop+4} Q 28 ${hugeDrop-8}, 38 28" fill="${ec}"/>`;
        svg += `<path d="M 66 24 Q ${80+hugeW} 20, ${86+hugeW} ${hugeDrop} Q ${88+hugeW} ${hugeDrop+8}, ${82+hugeW-6} ${hugeDrop+4} Q 72 ${hugeDrop-8}, 62 28" fill="${ec}"/>`;
        break;
      }
      default: // one
        svg += `<circle cx="32" cy="22" r="${10*es}" fill="${ec}"/><circle cx="32" cy="22" r="${6*es}" fill="${ic}" opacity="0.5"/>`;
        svg += `<path d="M 64 22 L 72 22" stroke="${ic}" stroke-width="2" opacity="0.3" stroke-linecap="round"/>`;
        svg += `<path d="M 68 19 L 68 25" stroke="${ic}" stroke-width="2" opacity="0.3" stroke-linecap="round"/>`;
    }
  }

  // Body
  const lc = lighten(color, 0.3);
  const gradId = 'bg'+Math.random().toString(36).slice(2,8);
  const gradDef = `<defs><radialGradient id="${gradId}" cx="0.4" cy="0.35" r="0.6"><stop offset="0" stop-color="${lc}"/><stop offset="1" stop-color="${color}"/></radialGradient></defs>`;
  svg += gradDef;
  switch(traits.bodyShape) {
    case 'round':
      svg += `<circle cx="${cx}" cy="${cy}" r="${28+sb}" fill="url(#${gradId})"/>`;
      svg += `<ellipse cx="${cx}" cy="${cy+4}" rx="${16+sb*0.4}" ry="${18+sb*0.4}" fill="${lc}" opacity="0.4"/>`;
      break;
    case 'oval':
      svg += `<ellipse cx="${cx}" cy="${cy+2}" rx="${22+sb}" ry="${26+sb}" fill="url(#${gradId})"/>`;
      svg += `<ellipse cx="${cx}" cy="${cy+6}" rx="${13+sb*0.3}" ry="${15+sb*0.3}" fill="${lc}" opacity="0.4"/>`;
      break;
    case 'bean': {
      const w=24+sb, h=28+sb;
      svg += `<path d="M ${cx} ${cy-h} C ${cx+w*0.9} ${cy-h}, ${cx+w} ${cy-h*0.4}, ${cx+w} ${cy} C ${cx+w} ${cy+h*0.5}, ${cx+w*0.6} ${cy+h}, ${cx} ${cy+h} C ${cx-w*0.6} ${cy+h}, ${cx-w} ${cy+h*0.5}, ${cx-w} ${cy+2} C ${cx-w} ${cy-h*0.3}, ${cx-w*0.7} ${cy-h}, ${cx} ${cy-h} Z" fill="url(#${gradId})"/>`;
      svg += `<ellipse cx="${cx+1}" cy="${cy+4}" rx="${13+sb*0.3}" ry="${15+sb*0.3}" fill="${lc}" opacity="0.35"/>`;
      break;
    }
    case 'pear': {
      const pw=24+sb, ph=26+sb;
      svg += `<path d="M ${cx} ${cy-ph} C ${cx+pw*0.6} ${cy-ph}, ${cx+pw*0.7} ${cy-ph*0.3}, ${cx+pw*0.8} ${cy} C ${cx+pw} ${cy+ph*0.4}, ${cx+pw*0.5} ${cy+ph}, ${cx} ${cy+ph} C ${cx-pw*0.5} ${cy+ph}, ${cx-pw} ${cy+ph*0.4}, ${cx-pw*0.8} ${cy} C ${cx-pw*0.7} ${cy-ph*0.3}, ${cx-pw*0.6} ${cy-ph}, ${cx} ${cy-ph} Z" fill="url(#${gradId})"/>`;
      svg += `<ellipse cx="${cx}" cy="${cy+6}" rx="${14+sb*0.3}" ry="${14+sb*0.3}" fill="${lc}" opacity="0.35"/>`;
      break;
    }
    case 'squish': {
      const sw=32+sb, sh=20+sb*0.6;
      svg += `<ellipse cx="${cx}" cy="${cy+4}" rx="${sw}" ry="${sh}" fill="url(#${gradId})"/>`;
      svg += `<ellipse cx="${cx}" cy="${cy+8}" rx="${sw*0.6}" ry="${sh*0.5}" fill="${lc}" opacity="0.4"/>`;
      break;
    }
    case 'tall': {
      const tw=18+sb*0.7, th=32+sb;
      svg += `<path d="M ${cx} ${cy-th} C ${cx+tw} ${cy-th}, ${cx+tw*1.1} ${cy-th*0.3}, ${cx+tw*1.1} ${cy} C ${cx+tw*1.1} ${cy+th*0.5}, ${cx+tw*0.8} ${cy+th}, ${cx} ${cy+th} C ${cx-tw*0.8} ${cy+th}, ${cx-tw*1.1} ${cy+th*0.5}, ${cx-tw*1.1} ${cy} C ${cx-tw*1.1} ${cy-th*0.3}, ${cx-tw} ${cy-th}, ${cx} ${cy-th} Z" fill="url(#${gradId})"/>`;
      svg += `<ellipse cx="${cx}" cy="${cy+6}" rx="${tw*0.55}" ry="${th*0.35}" fill="${lc}" opacity="0.35"/>`;
      break;
    }
    case 'chonk': {
      const cr2=34+sb;
      svg += `<circle cx="${cx}" cy="${cy+2}" r="${cr2}" fill="url(#${gradId})"/>`;
      svg += `<ellipse cx="${cx}" cy="${cy+8}" rx="${cr2*0.55}" ry="${cr2*0.45}" fill="${lc}" opacity="0.4"/>`;
      break;
    }
    case 'teardrop': {
      const dw=26+sb, dh=28+sb;
      svg += `<path d="M ${cx} ${cy-dh} C ${cx+dw*0.3} ${cy-dh}, ${cx+dw*0.4} ${cy-dh*0.6}, ${cx+dw*0.5} ${cy-dh*0.2} C ${cx+dw*0.8} ${cy+dh*0.1}, ${cx+dw} ${cy+dh*0.5}, ${cx+dw*0.6} ${cy+dh} Q ${cx} ${cy+dh*1.1}, ${cx-dw*0.6} ${cy+dh} C ${cx-dw} ${cy+dh*0.5}, ${cx-dw*0.8} ${cy+dh*0.1}, ${cx-dw*0.5} ${cy-dh*0.2} C ${cx-dw*0.4} ${cy-dh*0.6}, ${cx-dw*0.3} ${cy-dh}, ${cx} ${cy-dh} Z" fill="url(#${gradId})"/>`;
      svg += `<ellipse cx="${cx}" cy="${cy+6}" rx="${dw*0.4}" ry="${dh*0.35}" fill="${lc}" opacity="0.35"/>`;
      break;
    }

    svg += `<g opacity="0.75"><circle cx="40" cy="44" r="5.5" fill="none" stroke="#6B5B4E" stroke-width="0.8"/><circle cx="60" cy="44" r="5.5" fill="none" stroke="#6B5B4E" stroke-width="0.8"/><path d="M 45.5 44 Q 50 42 54.5 44" stroke="#6B5B4E" stroke-width="0.8" fill="none"/><path d="M 34.5 44 L 30 43" stroke="#6B5B4E" stroke-width="0.8" stroke-linecap="round"/><path d="M 65.5 44 L 70 43" stroke="#6B5B4E" stroke-width="0.8" stroke-linecap="round"/><path d="M 37 42 L 38.5 41" stroke="white" stroke-width="0.5" stroke-linecap="round" opacity="0.5"/><path d="M 57 42 L 58.5 41" stroke="white" stroke-width="0.5" stroke-linecap="round" opacity="0.5"/></g>`;
  } else if (accessory === 'lab_coat') {
    svg += `<g opacity="0.7"><path d="M 30 55 L 28 70 Q 30 72 35 71 L 38 58" fill="#F0EDE8"/><path d="M 70 55 L 72 70 Q 70 72 65 71 L 62 58" fill="#F0EDE8"/><path d="M 38 52 L 42 58 L 50 55 L 58 58 L 62 52" fill="#D5D0C8" opacity="0.8"/><rect x="30" y="63" width="5" height="4" rx="0.5" fill="none" stroke="#D5D0C8" stroke-width="0.5"/></g>`;
  } else if (accessory === 'bow_tie') {
    svg += `<path d="M 50 58 L 42 55 L 42 61 Z" fill="#FF5252" opacity="0.8"/><path d="M 50 58 L 58 55 L 58 61 Z" fill="#FF5252" opacity="0.8"/><circle cx="50" cy="58" r="1.8" fill="#CC3333"/>`;
  } else if (accessory === 'beret') {
    const bc = darken(color, 0.25), bl = lighten(bc, 0.15), bn = lighten(bc, 0.2);
    const bt2 = 50 - 26 - 4;
    svg += `<g opacity="0.85"><ellipse cx="55" cy="${bt2+2}" rx="16" ry="6" fill="${bc}"/><circle cx="60" cy="${bt2-1}" r="4" fill="${bc}"/><path d="M 39 ${bt2+4} Q 50 ${bt2+7} 71 ${bt2+4}" stroke="${bl}" stroke-width="1.2" fill="none"/><circle cx="60" cy="${bt2-4}" r="1.2" fill="${bn}"/></g>`;
  } else if (accessory === 'stethoscope') {
    svg += `<g opacity="0.7"><path d="M 38 50 Q 35 58 38 66 Q 42 72 50 72 Q 58 72 62 66 Q 65 58 62 50" stroke="#4A90D9" stroke-width="1.2" fill="none" stroke-linecap="round"/><circle cx="50" cy="72" r="3" fill="#C0C0C0"/><circle cx="50" cy="72" r="1.8" fill="#A0A0A0"/><circle cx="38" cy="49" r="1" fill="#C0C0C0"/><circle cx="62" cy="49" r="1" fill="#C0C0C0"/></g>`;
  } else if (accessory === 'graduation_cap') {
    const bt3 = 50 - 26 - 4;
    svg += `<path d="M 50 ${bt3-6} L 68 ${bt3} L 50 ${bt3+6} L 32 ${bt3} Z" fill="#2D1B4E" opacity="0.85"/><circle cx="50" cy="${bt3}" r="1.5" fill="#FFD700"/><path d="M 50 ${bt3} L 68 ${bt3} L 70 ${bt3+2} Q 68 ${bt3+10} 66 ${bt3+14}" stroke="#FFD700" stroke-width="1" fill="none" stroke-linecap="round"/><circle cx="66" cy="${bt3+15}" r="1.5" fill="#FFD700"/>`;
  }

  const animClass = status==='running'?'animate-both':status==='error'?'animate-breathe':'';
  return `<div class="${animClass}"><svg width="${size}" height="${size}" viewBox="0 0 100 100">${svg}</svg></div>`;
}

// Tier/stage names
const TIER_NAMES = ['Newcomer','Apprentice','Tested','Verified','Distinguished','Master'];
const STATUS_LABELS = {running:'Running',stopped:'Sleeping',paused:'Curious',error:'Distressed'};

function render() {
  const botId = document.getElementById('botId').value || 'demo';
  const status = document.getElementById('status').value;
  const mood = document.getElementById('mood').value;
  const hunger = document.getElementById('hunger').value;
  const accessory = document.getElementById('accessory').value || undefined;

  // Main preview
  document.getElementById('mainPreview').innerHTML = `
    <div class="single-card">
      ${renderAvatar(botId, selectedColor, 3, status, mood, hunger, 180, accessory)}
      <div class="card-title" style="margin-top:8px">${botId}</div>
      <div class="card-label">${TIER_NAMES[3]} &middot; ${STATUS_LABELS[status]} &middot; ${mood}</div>
    </div>
  `;

  // Tier grid
  let tierHtml = '';
  for (let i=0;i<=5;i++) {
    tierHtml += `<div class="card">
      ${renderAvatar(botId, selectedColor, i, 'running', 'positive', 'satisfied', 130)}
      <div class="card-title">Tier ${i}</div>
      <div class="card-label">${TIER_NAMES[i]}</div>
    </div>`;
  }
  document.getElementById('tierGrid').innerHTML = tierHtml;

  // Status grid
  let statusHtml = '';
  for (const s of ['running','stopped','paused','error']) {
    statusHtml += `<div class="card">
      ${renderAvatar(botId, selectedColor, 3, s, s==='running'?'positive':'neutral', 'satisfied', 130)}
      <div class="card-title">${STATUS_LABELS[s]}</div>
      <div class="card-label">${s}</div>
    </div>`;
  }
  // Hunger states
  for (const h of ['curious','yearning','starving']) {
    statusHtml += `<div class="card">
      ${renderAvatar(botId, selectedColor, 2, 'paused', 'neutral', h, 130)}
      <div class="card-title">Hunger: ${h}</div>
      <div class="card-label">Knowledge ${h}</div>
    </div>`;
  }
  document.getElementById('statusGrid').innerHTML = statusHtml;

  // All Moods
  const MOOD_LABELS = {neutral:'Neutral',positive:'Positive',negative:'Negative',milestone:'Milestone',proud:'Proud',focused:'Focused',excited:'Excited',shy:'Shy',tired:'Tired'};
  let moodHtml = '';
  for (const m of ['neutral','positive','negative','milestone','proud','focused','excited','shy','tired']) {
    moodHtml += `<div class="card">
      ${renderAvatar(botId, selectedColor, 3, 'running', m, 'satisfied', 120)}
      <div class="card-title">${MOOD_LABELS[m]}</div>
      <div class="card-label">${m}</div>
    </div>`;
  }
  document.getElementById('moodGrid').innerHTML = moodHtml;

  // All Accessories
  const ACC_LABELS = {tiny_glasses:'Tiny Glasses',lab_coat:'Lab Coat',bow_tie:'Bow Tie',beret:'Beret',stethoscope:'Stethoscope',graduation_cap:'Graduation Cap'};
  let accHtml = '';
  for (const a of ['tiny_glasses','lab_coat','bow_tie','beret','stethoscope','graduation_cap']) {
    accHtml += `<div class="card">
      ${renderAvatar(botId, selectedColor, 3, 'running', 'positive', 'satisfied', 120, a)}
      <div class="card-title">${ACC_LABELS[a]}</div>
      <div class="card-label">${a}</div>
    </div>`;
  }
  document.getElementById('accessoryGrid').innerHTML = accHtml;

  // All 30 Species
  const SPECIES = [
    {seed:'bubbles',name:'Bubbles',desc:'Round & friendly'},
    {seed:'spike',name:'Spike',desc:'Sleek & sharp'},
    {seed:'nugget',name:'Nugget',desc:'Chunky & curious'},
    {seed:'cosmos',name:'Cosmos',desc:'Soft & dreamy'},
    {seed:'jellybean',name:'Jellybean',desc:'Spotted & playful'},
    {seed:'pudding',name:'Pudding',desc:'Tall & fluffy'},
    {seed:'sprout',name:'Sprout',desc:'Round & floppy'},
    {seed:'ember',name:'Ember',desc:'Bold & fiery'},
    {seed:'mochi',name:'Mochi',desc:'Squishy & sweet'},
    {seed:'phantom',name:'Phantom',desc:'Ghostly & gentle'},
    {seed:'biscuit',name:'Biscuit',desc:'Warm & cuddly'},
    {seed:'wisp',name:'Wisp',desc:'Tiny & mysterious'},
    {seed:'maple',name:'Maple',desc:'Tall & graceful'},
    {seed:'pebble',name:'Pebble',desc:'Little & mighty'},
    {seed:'dumpling',name:'Dumpling',desc:'Plump & lovable'},
    {seed:'cricket',name:'Cricket',desc:'Bouncy & bright'},
    {seed:'cloud',name:'Cloud',desc:'Soft & floaty'},
    {seed:'thorn',name:'Thorn',desc:'Spiky but sweet'},
    {seed:'pippin',name:'Pippin',desc:'Perky & peppy'},
    {seed:'starling',name:'Starling',desc:'Small & sparkly'},
    {seed:'splat',name:'Splat',desc:'Melted but trying'},
    {seed:'loafer',name:'Loafer',desc:'Bread-shaped genius'},
    {seed:'professor',name:'Professor',desc:'One ear, all brain'},
    {seed:'oops',name:'Oops',desc:'Happy little accident'},
    {seed:'unit',name:'Unit',desc:'Absolute unit'},
    {seed:'crouton',name:'Crouton',desc:'Crunchy on the outside'},
    {seed:'gremlin',name:'Gremlin',desc:'Chaotic but lovable'},
    {seed:'sir',name:'Sir Flops',desc:'Distinguished & floppy'},
    {seed:'potato',name:'Potato',desc:'Peak performance'},
    {seed:'yeet',name:'Yeet',desc:'Built for speed (not really)'},
  ];
  let speciesHtml = '';
  SPECIES.forEach((sp, i) => {
    const c = COLORS[i % COLORS.length];
    speciesHtml += `<div class="card">
      ${renderAvatar(sp.seed, c, 3, 'running', 'positive', 'satisfied', 120)}
      <div class="card-title">${sp.name}</div>
      <div class="card-label">${sp.desc}</div>
    </div>`;
  });
  document.getElementById('speciesGrid').innerHTML = speciesHtml;

  // Gallery — random bots
  let galleryHtml = '';
  const sampleIds = [
    'bot_alice_42','bot_bob_99','bot_charlie_7','bot_diana_13',
    'bot_echo_55','bot_frank_88','bot_grace_21','bot_hank_64',
    'bot_iris_36','bot_jade_77','bot_kai_11','bot_luna_50'
  ];
  sampleIds.forEach((id, i) => {
    const c = COLORS[i % COLORS.length];
    const tier = Math.floor(seededRandom(hashCode(id), 99) * 6);
    const statuses = ['running','running','running','stopped','paused','error'];
    const st = statuses[Math.floor(seededRandom(hashCode(id), 100) * statuses.length)];
    galleryHtml += `<div class="card">
      ${renderAvatar(id, c, tier, st, st==='running'?'positive':'neutral', 'satisfied', 120)}
      <div class="card-title">${id.replace('bot_','').replace(/_/g,' ')}</div>
      <div class="card-label">${TIER_NAMES[tier]} &middot; ${STATUS_LABELS[st]}</div>
    </div>`;
  });
  document.getElementById('galleryGrid').innerHTML = galleryHtml;
}

// Color swatches
function initSwatches() {
  const container = document.getElementById('swatches');
  COLORS.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'swatch' + (i===0?' active':'');
    el.style.background = c;
    el.title = COLOR_NAMES[i];
    el.onclick = () => {
      selectedColor = c;
      document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
      el.classList.add('active');
      render();
    };
    container.appendChild(el);
  });
}

initSwatches();
render();
</script>
